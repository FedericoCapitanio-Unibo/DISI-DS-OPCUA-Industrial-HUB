events {
    worker_connections 1024;
}

http {
    # upstream con i 3 nodi HUB
    upstream hub_nodes {
        server node-a:8000 max_fails=10 fail_timeout=30s;
        server node-b:8001 max_fails=10 fail_timeout=30s;
        server node-c:8002 max_fails=10 fail_timeout=30s;
    }

    # redirect HTTP -> HTTPS (porta 80)
    server {
        listen 80;
        server_name localhost;
        return 301 https://$server_name$request_uri;
    }

    # server HTTPS principale (porta 443)
    server {
        listen 443 ssl;
        server_name localhost;

        # gestisce richieste HTTP inviate erroneamente alla porta 443
        error_page 497 301 =307 https://$host$request_uri;

        # certificati TLS
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # configurazione TLS sicura
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # headers di sicurezza
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";

        # logging
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        # pagine documentazione - proxy diretto
        location = /docs {
            proxy_pass http://hub_nodes;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /redoc {
            proxy_pass http://hub_nodes;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # openapi.json necessario per docs/redoc
        location = /openapi.json {
            proxy_pass http://hub_nodes;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API endpoints - proxy diretto
        location /api/ {
            proxy_pass http://hub_nodes;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 30s;
        }

        # health check endpoint per nginx stesso
        location = /nginx-health {
            return 200 "OK";
            add_header Content-Type text/plain;
        }

        # tutto il resto -> redirect a /docs
        location / {
            return 302 /docs;
        }
    }
}